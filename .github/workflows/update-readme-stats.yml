name: Update README stats

on:
  schedule:
    - cron: "17 3 * * *" # daily ~12:17 JST
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-readme-stats.yml"

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Prefer README_STATS_TOKEN (PAT with repo + read:user) for private contribution counts.
      # Falls back to GITHUB_TOKEN (public activity only).
      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: >-
            username=kodai3&count_private=true&show_icons=true&theme=dracula
          path: profile/stats.svg
          token: ${{ secrets.README_STATS_TOKEN || github.token }}
          fail_on_error: "true"

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: >-
            username=kodai3&hide=jupyter%20notebook&layout=compact&theme=dracula
          path: profile/top-langs.svg
          token: ${{ secrets.README_STATS_TOKEN || github.token }}
          fail_on_error: "true"

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore: refresh profile README stats cards" || exit 0
          git push
